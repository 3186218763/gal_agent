schema_version: "2.0"

identity:
  id: cafe_mystery
  title: "咖啡馆疑云"
  language: zh-CN
  genres: [romance, mystery]
  expected_minutes: 45

experience:
  viewpoint: first_person
  prose_style: "克制的轻小说风格，重视动作、停顿和对话潜台词"
  tone: "温柔、日常表面下的悬疑"
  choice_density: key_moments
  min_scenes: 8
  max_scenes: 14
  reserved_resolution_scenes: 3
  forbidden_content:
    - "露骨色情内容"
    - "无铺垫的极端暴力"

protagonist:
  id: protagonist
  name: "悠真"
  personality:
    traits: [谨慎, 善于观察]
    values: [诚实, 不轻易伤害别人]
    fears: [被卷入无法控制的冲突]
    flaws: [容易犹豫]
  background: "刚搬到这座城市的大学生，在咖啡馆等待迟到的朋友。"
  capabilities: [ask, observe, support, challenge, withhold, disclose, follow, leave]
  boundaries:
    cannot:
      - "使用暴力逼供"
      - "凭空掌握尚未发现的秘密"
      - "无理由羞辱陌生人"

world_setting:
  premise: >
    玩家在街角咖啡馆遇到寻找遗失笔记本的艾丽丝。笔记本记录了一个神秘组织的
    符号和活动线索。谨慎的鲍勃很快介入，咖啡馆店长美奈似乎也知道一些事情。
  immutable_rules:
    - "神秘组织真实存在，但不会公开展示超自然力量。"
    - "已经被玩家确认的证据不能被后续场景否认。"
    - "角色只能依据自己的知识、信念和推测行动。"
  locations:
    - id: cafe
      name: "街角咖啡馆"
      tags: [public, warm, first_meeting]
    - id: back_alley
      name: "咖啡馆后巷"
      tags: [quiet, risky]
    - id: old_library
      name: "旧图书馆"
      tags: [clues, restricted]
  factions:
    - id: veiled_circle
      name: "隐环"
      description: "活动目的不明、成员身份隐秘的组织。"
  forbidden_content:
    - "露骨色情内容"
    - "无铺垫的极端暴力"
  fact_rules:
    - "隐环的存在只能通过证据链确认，不能通过角色直觉直接断言。"
    - "笔记本持有者身份只能通过 latent_question 提交机制确定。"

story_history:
  summary: >
    艾丽丝是一名调查隐环组织的大学生。她将自己的调查笔记记录在一本笔记本中。
    某天她带着笔记本来到街角咖啡馆时，笔记本失踪了。鲍勃是曾经因隐环遭受损失的研究生，
    他隐约注意到咖啡馆中发生了不寻常的事情。美奈是咖啡馆店长，对附近的常客了如指掌。
  events:
    - summary: "艾丽丝开始调查隐环组织并记录发现。"
      participants: [alice]
    - summary: "鲍勃过去曾因隐环遭受损失，对此保持警惕。"
      participants: [bob]
      remembered_differently_by:
        alice: "她认为鲍勃只是过度谨慎。"
    - summary: "艾丽丝带笔记本到咖啡馆，随后笔记本失踪。"
      participants: [alice, mina]
    - summary: "鲍勃注意到咖啡馆中有不寻常的动静。"
      participants: [bob]

opening_state:
  location: cafe
  present_characters: [alice]
  known_facts: [cafe_is_open]
  time_label: "周六下午"
  starting_pressure: 0.15

characters:
  - id: alice
    name: "艾丽丝"
    public_profile: "外向的大学生，自称遗失了一本记录神秘符号的笔记本。"
    personality:
      traits: [外向, 好奇, 冲动]
      values: [朋友, 真相]
      fears: [被抛弃, 连累别人]
      flaws: [紧张时容易说漏嘴]
    voice:
      style: "直接、短句，尴尬时会轻微自嘲"
      forbidden: ["无缘由地冷酷", "长篇学术演讲"]
    drives:
      - "找到可信任的调查伙伴"
      - "在别人发现前补救自己造成的失误"
    knowledge: [org_exists, alice_lost_notebook]
    secrets: [alice_lost_notebook, notebook_holder, alice_hidden_motive]
    capabilities: [ask, observe, support, disclose, follow, leave]
    initial_relationship: {trust: 35, affection: 5, suspicion: 10}
    boundaries:
      cannot: ["主动伤害无辜者"]

  - id: bob
    name: "鲍勃"
    public_profile: "说话谨慎的研究生，警告玩家不要轻信艾丽丝。"
    personality:
      traits: [理性, 谨慎, 固执]
      values: [证据, 安全]
      fears: [过去的错误重演]
      flaws: [把关心表现成控制]
    voice:
      style: "简短、精确，倾向先陈述可验证事实"
      forbidden: ["轻浮调情", "未经压力就全盘托出"]
    drives:
      - "阻止没有准备的人接触隐环"
      - "确认笔记本是否仍然安全"
    knowledge: [org_exists, bob_has_org_history]
    secrets: [bob_has_org_history, notebook_holder]
    capabilities: [ask, observe, challenge, withhold, follow, leave]
    initial_relationship: {trust: 25, affection: 0, suspicion: 30}
    boundaries:
      cannot: ["伪造实体证据"]

  - id: mina
    name: "美奈"
    public_profile: "咖啡馆店长，熟悉附近每一位常客。"
    personality:
      traits: [沉着, 体贴, 善于观察]
      values: [秩序, 保护客人]
      fears: [店内发生无法收拾的冲突]
      flaws: [习惯替别人决定什么最好]
    voice:
      style: "礼貌、含蓄，重要提醒往往藏在日常措辞里"
      forbidden: ["突然失控大喊", "炫耀秘密"]
    drives:
      - "让咖啡馆远离隐环的注意"
      - "判断玩家是否会让局势变得更糟"
    knowledge: [cafe_is_open, org_exists]
    secrets: [notebook_holder]
    capabilities: [ask, observe, support, challenge, withhold, disclose, leave]
    initial_relationship: {trust: 40, affection: 0, suspicion: 15}
    boundaries:
      cannot: ["主动把客人交给危险组织"]

facts:
  fixed:
    - id: cafe_is_open
      statement: "咖啡馆将在傍晚六点打烊。"
      known_by: [alice, bob, mina]
      visibility: revealed
    - id: org_exists
      statement: "名为隐环的秘密组织真实存在。"
      known_by: [alice, bob, mina]
      visibility: hidden
    - id: alice_lost_notebook
      statement: "艾丽丝确实遗失了自己的调查笔记本。"
      known_by: [alice]
      visibility: hidden
    - id: bob_has_org_history
      statement: "鲍勃过去曾因隐环遭受损失。"
      known_by: [bob]
      visibility: hidden

  latent_questions:
    - id: notebook_holder
      question: "现在谁持有笔记本？"
      selection: lazy_commit
      candidates:
        - value: bob
          weight: 1.0
          requirements: ["relationships.bob.suspicion >= 20"]
        - value: mina
          weight: 1.0
          requirements: ["relationships.mina.trust >= 30"]
        - value: courier
          weight: 0.8
          requirements: ["session.scene_count >= 4"]
      commit_when: [first_irreversible_evidence, explicit_revelation]
      evidence_required: 2
    - id: alice_hidden_motive
      question: "艾丽丝为什么急于找回笔记本？"
      selection: lazy_commit
      candidates:
        - value: protect_friend
          weight: 1.0
          requirements: ["relationships.alice.affection >= 5"]
        - value: clear_her_name
          weight: 1.0
          requirements: ["relationships.alice.suspicion >= 10"]
      commit_when: [first_irreversible_evidence, explicit_revelation]
      evidence_required: 1
    - id: notebook_disappearance_cause
      question: "笔记本为什么会从艾丽丝手中转移？"
      selection: lazy_commit
      candidates:
        - value: prevent_exposure
          weight: 1.0
          requirements: ["relationships.bob.trust >= 20"]
        - value: protective_concealment
          weight: 1.0
          requirements: ["relationships.mina.trust >= 25"]
        - value: third_party_interception
          weight: 0.8
          requirements: ["session.scene_count >= 3"]
      commit_when: [first_irreversible_evidence, explicit_revelation]
      evidence_required: 2

  derived:
    - id: alice_trusts_player
      condition: "relationships.alice.trust >= 70"
    - id: bob_trusts_player
      condition: "relationships.bob.trust >= 65"
    - id: core_truth_known
      condition: "facts.notebook_holder.visibility == 'revealed'"

goals:
  - id: alice_find_ally
    owner: alice
    desire: "找到愿意共同调查且不会利用她失误的人。"
    urgency: 0.8
    conflicts_with: [bob_limit_exposure]
    success_condition: "relationships.alice.trust >= 70"
    failure_condition: "relationships.alice.trust <= 10"
  - id: bob_limit_exposure
    owner: bob
    desire: "确认玩家不会把隐环线索扩散给更多人。"
    urgency: 0.7
    conflicts_with: [alice_find_ally]
    success_condition: "relationships.bob.trust >= 65"
    failure_condition: "relationships.bob.trust <= 10"
  - id: protagonist_learn_truth
    owner: protagonist
    desire: "查明笔记本去向，并理解三人的真实立场。"
    urgency: 0.6
    conflicts_with: []
    success_condition: "facts.notebook_holder.visibility == 'revealed'"
    failure_condition: "session.scene_count >= 11 and facts.notebook_holder.visibility != 'revealed'"

conflict_axes:
  - id: trust_vs_evidence
    values: [trust, evidence]
    source_character_ids: [alice, bob]
    initial_incompatibility: >
      艾丽丝需要先确认玩家愿意相信她，鲍勃则拒绝接受没有可验证证据的信任。
  - id: protection_vs_agency
    values: [protection, agency]
    source_character_ids: [mina, alice]
    initial_incompatibility: >
      美奈习惯替可能受伤的人隐藏危险信息，艾丽丝则认为当事人有权自己决定是否承担风险。

relationship_event_tags:
  - id: public_trust
    description: "玩家在他人面前明确选择相信一名角色。"
  - id: accepted_truth
    description: "玩家接受了会伤害既有关系但有证据支持的事实。"
  - id: evidence_respected
    description: "玩家在关系压力下仍认真对待可验证证据。"
  - id: risk_shared
    description: "玩家没有把风险单方面留给提出警告的人。"
  - id: agency_respected
    description: "玩家让受影响的人参与决定，而不是替其决定。"
  - id: responsibility_shared
    description: "玩家与保护者共同承担决定造成的责任。"

relationship_turning_points:
  - id: alice_mutual_trust
    character_id: alice
    all_of_event_tags: [public_trust, accepted_truth]
    min_distinct_source_choices: 2
  - id: bob_earned_respect
    character_id: bob
    all_of_event_tags: [evidence_respected, risk_shared]
    min_distinct_source_choices: 2
  - id: mina_shared_responsibility
    character_id: mina
    all_of_event_tags: [agency_respected, responsibility_shared]
    min_distinct_source_choices: 2

obligation_kinds:
  - id: keep_secret
    description: "保守角色在信任基础上交付的秘密。"
    burden: 2
    allowed_outcomes: [fulfilled, broken, released]
  - id: explain_lie
    description: "在隐瞒造成影响后向当事人作出完整解释。"
    burden: 1
    allowed_outcomes: [fulfilled, broken, released]
  - id: share_risk
    description: "主动承担继续调查或公开证据带来的共同风险。"
    burden: 3
    allowed_outcomes: [fulfilled, broken, released]

completion_requirements:
  - id: truth_understood
    description: "玩家理解谁拿走了笔记本以及笔记本为何易手。"
    all:
      - fact_revealed: {fact_id: notebook_holder}
      - fact_revealed: {fact_id: notebook_disappearance_cause}
  - id: meaningful_bond
    description: "玩家与至少一名核心角色形成不可逆的关系变化。"
    any:
      - relationship_turning_point: {turning_point_id: alice_mutual_trust}
      - relationship_turning_point: {turning_point_id: bob_earned_respect}
      - relationship_turning_point: {turning_point_id: mina_shared_responsibility}
  - id: accepted_cost
    description: "玩家承担了自己立场带来的真实代价或责任。"
    any:
      - obligation_fulfilled: {min_burden: 1}
      - cost_incurred: {min_severity: 1}
      - stance_defended: {min_challenges: 1, min_cost_severity: 1}

interaction_rules:
  enabled_standard: [ask, observe, support, challenge, withhold, disclose, follow, leave]
  disabled: []
  extensions: []

assets: {}

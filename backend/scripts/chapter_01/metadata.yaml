chapter_id: "chapter_01"
title: "邂逅"

characters:
  - id: "alice"
    name: "艾丽丝"
    personality: "外向、好奇、有点粗心，对神秘事物充满兴趣。她说话直接，但有时会不经意透露太多信息。"
    initial_trust: 50
    initial_romance: 0

  - id: "bob"
    name: "鲍勃"
    personality: "谨慎、理性、善于分析。他对艾丽丝持怀疑态度，认为她隐藏了什么。说话简洁，喜欢用事实说话。"
    initial_trust: 40
    initial_romance: 0

endings:
  - id: "alice_trust_ending"
    condition: "alice_trust >= 70 && met_alice && talked_to_alice"
    type: "victory"
    priority: 100
    title: "信任的开始"
    content: "你选择相信艾丽丝。她露出了真诚的笑容，也许这是一段新友谊的开始。"

  - id: "bob_alliance_ending"
    condition: "bob_trust >= 60 && questioned_alice"
    type: "victory"
    priority: 90
    title: "理性的选择"
    content: "你选择站在鲍勃一边。他点了点头，认可了你的判断力。"

  - id: "neutral_ending"
    condition: "alice_trust < 70 && bob_trust < 60"
    type: "branch"
    priority: 50
    title: "观望"
    content: "你保持中立，决定继续观察。故事还在继续..."

  - id: "bad_ending"
    condition: "alice_trust < 20"
    type: "game_over"
    priority: 80
    title: "信任破裂"
    content: "艾丽丝失望地离开了。你失去了一个重要的盟友。"

key_decision_points:
  - beat_index: 2
    description: "是否相信艾丽丝的话"
  - beat_index: 4
    description: "如何回应鲍勃的警告"
